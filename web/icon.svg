<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Yap's icon: Pixelarticons' "message-text" (MIT, README › Credits) on the teal desktop.
       One grid cell = 1 px at 32 px, so the 16 px title-bar icon is crisp on 2x screens. -->
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b8f8f"/>
      <stop offset="1" stop-color="#006b6b"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" fill="url(#teal)"/>
  <path transform="translate(4 4)" fill="#fff" d="M20 2H2v20h2V4h16v12H6v2H4v2h2v-2h16V2h-2zM6 7h12v2H6V7zm8 4H6v2h8v-2z"/>
</svg>
