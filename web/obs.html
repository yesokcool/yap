<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yap · OBS voice</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    /* A Browser Source: transparent, just the people in the call. */
    html, body { margin: 0; background: transparent; color: #fff; font: 600 18px/1.2 -apple-system, 'Segoe UI', Inter, Roboto, sans-serif; overflow: hidden; }
    .stage { display: flex; flex-wrap: wrap; gap: 14px; padding: 16px; }
    .stage.hidden { display: none; }
    .who { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 96px; transition: transform 0.2s, opacity 0.3s; }
    .who.quiet { opacity: 0.55; }
    .face { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; overflow: hidden; background: var(--c, #555); font-size: 30px; box-shadow: 0 2px 10px rgb(0 0 0 / 0.5); transition: box-shadow 0.15s; }
    .face img { width: 100%; height: 100%; object-fit: cover; }
    .who.speaking { transform: translateY(-4px); opacity: 1; }
    .who.speaking .face { box-shadow: 0 0 0 4px #30d158, 0 0 18px #30d158; }
    .name { max-width: 100%; padding: 2px 8px; border-radius: 999px; background: rgb(0 0 0 / 0.6); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .note { position: fixed; inset: auto 16px 16px 16px; padding: 10px 14px; border-radius: 12px; background: rgb(0 0 0 / 0.7); font-size: 14px; font-weight: 500; }
    button.start { position: fixed; inset: 0; margin: auto; width: 260px; height: 64px; border: 0; border-radius: 16px; background: #0a84ff; color: #fff; font: 600 17px -apple-system, 'Segoe UI', sans-serif; cursor: pointer; }
  </style>
  <script type="module" src="js/obs.js"></script>
</head>
<body>
  <div class="stage" id="stage"></div>
  <div class="note" id="note" hidden></div>
  <button class="start" id="start" hidden>Start listening</button>
  <div id="audio-sink" hidden></div>
</body>
</html>
