<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found · Yap</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/js/theme.js"></script>
  <style>
    body { overflow: auto; }
    .dl { max-width: 420px; margin: 24px auto; padding: 0 8px 40px; }
    .dl-window { padding: 3px; background: var(--face); box-shadow: var(--frame); }
    .dl-body { padding: 12px 10px 4px; }
    .dl-body p { margin: 0 0 10px; }
    .dl-actions { display: flex; justify-content: flex-end; padding: 4px 6px 8px; }
  </style>
</head>
<body>
  <!-- Any address Yap doesn't have (worker/index.ts sends this page with a 404). -->
  <main class="dl">
    <div class="dl-window">
      <div class="title-bar"><img class="title-icon" src="/icon.svg" alt=""><span class="title-text">Page not found</span></div>
      <div class="dl-body">
        <p>There's nothing at this address. The link may have a typo in it, or the page has moved.</p>
      </div>
      <div class="dl-actions"><a class="btn primary" href="/">Back to Yap</a></div>
    </div>
  </main>
</body>
</html>
